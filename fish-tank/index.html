<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#070b12;color:#cfe3ff;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;padding:14px 16px 24px}
h1{margin:4px 0 12px;font-size:1.4rem;letter-spacing:.06em;color:#7ef0c8}
.board{width:min(100%,680px);background:#1b1f27;border-radius:14px;padding:12px;box-shadow:0 14px 40px #000a}

.strip{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.strip a,.strip button{font:700 .8rem system-ui,sans-serif;letter-spacing:.06em;color:#cfe3ff;background:#2b3240;border:0;border-radius:6px;padding:8px 12px;text-decoration:none;cursor:pointer}
.led{width:16px;height:16px;border-radius:50%;background:#222;transition:background .2s}
.help{width:min(100%,680px);margin-top:14px;color:#8fa3bf;font-size:.92rem}
body.big{padding:0;justify-content:center;background:#000}
body.big h1,body.big .help{display:none}
body.big .board{width:100%;max-width:none;border-radius:0;padding:0;background:#000}
body.big canvas{width:min(100vw,calc(100vh * 320 / 216));margin:0 auto}
body.big .strip{position:fixed;right:10px;bottom:10px;margin:0}
body.big .strip a,body.big .led{display:none}
</style>

<script>
"use strict";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const W = 320, H = 216, img = ctx.createImageData(W, H);
const ledEl = document.getElementById("led");
const store = (() => { try { localStorage.setItem("aq.t", "1"); localStorage.removeItem("aq.t"); return localStorage; } catch (e) { return null; } })();
const mem = {};
const sget = k => { try { return store ? store.getItem(k) : (k in mem ? mem[k] : null); } catch (e) { return null; } };
const sset = (k, v) => { mem[k] = v; try { if (store) store.setItem(k, v); } catch (e) {} };
const sdel = k => { delete mem[k]; try { if (store) store.removeItem(k); } catch (e) {} };
const enc = new TextEncoder(), dec = new TextDecoder();
let wasm = null;
const u8 = () => new Uint8Array(wasm.memory.buffer);
const cstr = p => { const u = u8(); let e = p; while (u[e]) e++; return dec.decode(u.subarray(p, e)); };
const t0 = performance.now();
const imports = {
  env: {
    js_millis: () => (performance.now() - t0) >>> 0,
    js_rand: () => crypto.getRandomValues(new Uint32Array(1))[0],
    js_led: (r, g, b) => { ledEl.style.background = (r | g | b) ? `rgb(${r},${g},${b})` : "#222"; ledEl.style.boxShadow = (r | g | b) ? `0 0 12px rgb(${r},${g},${b})` : "none"; },
    js_pref_get: (k, out, cap) => {
      const v = sget("aq." + cstr(k)); if (v === null) return -1;
      const b = enc.encode(v), n = Math.min(b.length, cap - 1), u = u8();
      u.set(b.subarray(0, n), out); u[out + n] = 0; return n;
    },
    js_pref_set: (k, v) => sset("aq." + cstr(k), cstr(v)),
    js_pref_del: k => sdel("aq." + cstr(k)),
    js_localtime: p => {
      const d = new Date(), v = new Int32Array(wasm.memory.buffer, p, 8);
      const y0 = new Date(d.getFullYear(), 0, 1);
      v.set([d.getSeconds(), d.getMinutes(), d.getHours(), d.getDate(), d.getMonth(), d.getFullYear() - 1900, d.getDay(), Math.floor((d - y0) / 864e5)]);
    },
  },
  wasi_snapshot_preview1: { fd_write: () => 0, fd_close: () => 0, fd_seek: () => 0 },
};

// touch: the finger's place in tank pixels, held while it is down
let down = false, tap = false, tx = 0, ty = 0;   // tap: a press the tank has not seen yet (a quick tap can end between frames)
function at(e) {
  const r = cv.getBoundingClientRect();
  tx = Math.max(0, Math.min(W - 1, Math.floor((e.clientX - r.left) * W / r.width)));
  ty = Math.max(0, Math.min(H - 1, Math.floor((e.clientY - r.top) * H / r.height)));
}
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); at(e); down = tap = true; e.preventDefault(); });
cv.addEventListener("pointermove", e => { if (down) at(e); });
const up = () => { down = false; };
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
cv.addEventListener("contextmenu", e => e.preventDefault());

// full screen (falls back to filling the window where the browser can't, e.g. iPhone)
const fsBtn = document.getElementById("fs");
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function setBig(on) { document.body.classList.toggle("big", on); fsBtn.textContent = on ? "EXIT" : "FULL SCREEN"; }
fsBtn.addEventListener("click", async () => {
  if (document.body.classList.contains("big")) { if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); setBig(false); return; }
  setBig(true);
  try { const el = document.documentElement; await (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch (e) {}
});
document.addEventListener("fullscreenchange", () => { if (!fsEl()) setBig(false); });

function frame() {
  wasm.web_frame(down || tap ? 1 : 0, tx, ty);
  tap = false;
  const px = new Uint16Array(wasm.memory.buffer, wasm.web_pixels(), wasm.web_width() * wasm.web_height());
  const d = img.data;
  for (let i = 0, j = 0; i < W * H; i++, j += 4) {
    const v = px[i], c = ((v & 255) << 8) | (v >> 8);          // the sprite keeps its colours byte-swapped for the panel
    const r = c >> 11, g = (c >> 5) & 63, b = c & 31;
    d[j] = (r << 3) | (r >> 2); d[j + 1] = (g << 2) | (g >> 4); d[j + 2] = (b << 3) | (b >> 2); d[j + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  requestAnimationFrame(frame);
}

(async () => {
  const bytes = window.AQ_WASM_B64 ? Uint8Array.from(atob(window.AQ_WASM_B64), c => c.charCodeAt(0)) : await (await fetch("aquarium.wasm")).arrayBuffer();
  const { instance } = await WebAssembly.instantiate(bytes, imports);
  wasm = instance.exports;
  wasm._initialize();
  wasm.web_init();
  requestAnimationFrame(frame);
})();
</script>
